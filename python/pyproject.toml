[project]
name = "agent-native-workspace"
version = "0.1.0"
description = "SQLAlchemy models for agent-native workspace (libSQL/SQLite)"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-cov>=5.0", "coverage>=7.0", "ruff>=0.5"]
mcp = ["mcp[cli]>=1.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=agent_native_workspace --cov-report=term-missing:skip-covered --cov-fail-under=90 -q"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
